version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      actions-patch-minor:
        update-types: ["patch", "minor"]
      actions-major:
        update-types: ["major"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Vite+ bundles its own Vitest; these must match it exactly, so they move with vite-plus.
      - dependency-name: vitest
      - dependency-name: "@vitest/*"
    cooldown:
      default-days: 1
    groups:
      npm-patch-minor:
        update-types: ["patch", "minor"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore"
