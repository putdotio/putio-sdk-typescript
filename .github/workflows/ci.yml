name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: Verify SDK
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Verify repository
        run: vp run verify

  compatibility:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: Compatibility / ${{ matrix.target }}
    needs:
      - verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: node
            command: node ./scripts/test-compat-node.ts
          - target: browser-chromium
            browser: chromium
            command: node ./scripts/test-compat-browser.ts
          - target: browser-firefox
            browser: firefox
            command: node ./scripts/test-compat-browser.ts
          - target: browser-webkit
            browser: webkit
            command: node ./scripts/test-compat-browser.ts
          - target: bun
            command: node ./scripts/test-compat-bun.ts

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Set up Bun
        if: matrix.target == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: vp install

      - name: Install browser runtime
        if: startsWith(matrix.target, 'browser-')
        timeout-minutes: 10
        run: vp exec playwright install --with-deps ${{ matrix.browser }}

      - name: Verify compatibility
        run: ${{ matrix.command }}
        env:
          PUTIO_COMPAT_BROWSERS: ${{ matrix.browser }}

  compatibility-result:
    if: always() && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    name: Compatibility result
    needs:
      - compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check compatibility matrix result
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          set -euo pipefail
          echo "compatibility matrix result: ${COMPATIBILITY_RESULT}"
          if [[ "${COMPATIBILITY_RESULT}" == "failure" || "${COMPATIBILITY_RESULT}" == "cancelled" ]]; then
            exit 1
          fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    needs:
      - verify
      - compatibility
    permissions:
      contents: read
      id-token: write
    uses: putdotio/.github/.github/workflows/frontend-release-npm.yml@6694b278a64e6884b6518176dd2b008774ca6979 # v1.0.1
    secrets:
      PUTIO_RELEASE_BOT_PRIVATE_KEY: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
